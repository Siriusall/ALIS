[Service]
# The API, control and research workers share one small PostgreSQL cluster.
# Keep API request bursts inside a fixed local budget; dashboard/status reads
# use short-lived autocommit connections and must never crowd out ledger work.
Environment=ALIS_BUSINESS_DB_MAX_CONNECTIONS=4
Environment=ALIS_DATA_DB_MAX_CONNECTIONS=3
Environment=DATABASE_CONNECT_TIMEOUT_SECONDS=5
Environment=DATABASE_STATEMENT_TIMEOUT_MS=30000
Environment=DATABASE_IDLE_IN_TRANSACTION_TIMEOUT_MS=60000
