[Service]
# Control work schedules and refreshes small durable projections.  It is not
# allowed to consume the API's full database budget while a task is retrying.
Environment=ALIS_BUSINESS_DB_MAX_CONNECTIONS=3
Environment=ALIS_DATA_DB_MAX_CONNECTIONS=2
Environment=DATABASE_CONNECT_TIMEOUT_SECONDS=5
Environment=DATABASE_STATEMENT_TIMEOUT_MS=30000
Environment=DATABASE_IDLE_IN_TRANSACTION_TIMEOUT_MS=60000
